server:
  port: ${PORT:8080}

spring:
  application:
    name: performance-appraisal
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appraisal}}
    username: ${DB_USERNAME:appraisal}
    password: ${DB_PASSWORD:appraisal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # MUST be overridden in production (at least 32 characters)
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-0123456789}
    ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    demo-users: ${SEED_DEMO_USERS:false}
    admin-password-reset: ${ADMIN_PASSWORD_RESET:false}
